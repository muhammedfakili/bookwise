# The whole system with one command.
#
#   docker compose up -d --build     API + chat/admin screens
#   open http://localhost:8501       (API docs: http://localhost:8000/docs)
#   docker compose stop              stop everything

services:
  api:
    build: .
    env_file:
      - path: .env  # GOOGLE_API_KEY (or another provider), APP_API_KEY. Never copied into the image.
        required: false
    volumes:
      - leadpilot-data:/data  # leads, bookings, handoffs and conversation state survive restarts
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    environment:
      LEADPILOT_API_URL: http://api:8000
      APP_API_KEY: ${APP_API_KEY:-}  # only this one value from .env; the LLM key stays with the API
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  leadpilot-data:
